name: Nagaland Lottery Daily Result Fetch and Cloud Sync

on:
  # GitHub cron uses UTC: 07:47 = 13:17 IST; 14:47 = 20:17 IST.
  # Offset away from the top of the hour to reduce schedule congestion.
  schedule:
    - cron: "47 7 * * *"
    - cron: "47 14 * * *"

  workflow_dispatch:
    inputs:
      draw:
        description: "Choose which Nagaland draw to fetch"
        required: true
        type: choice
        options:
          - 1pm
          - 8pm
      date:
        description: "Target draw date (YYYY-MM-DD); leave blank for today's IST date"
        required: false
        type: string

permissions:
  contents: read

jobs:
  fetch-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 195
    env:
      SAMBAD_API_TOKEN: ${{ secrets.LOTTERY_SAMBAD_API_TOKEN }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select draw
        id: draw
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRAW="${{ inputs.draw }}"
            if [ -n "${{ inputs.date }}" ]; then
              DRAW_DATE="${{ inputs.date }}"
            else
              DRAW_DATE="$(TZ=Asia/Kolkata date +%F)"
            fi
          elif [ "${{ github.event.schedule }}" = "47 7 * * *" ]; then
            DRAW="1pm"
            DRAW_DATE="$(TZ=Asia/Kolkata date +%F)"
          else
            DRAW="8pm"
            DRAW_DATE="$(TZ=Asia/Kolkata date +%F)"
          fi
          python -c 'import datetime,sys; datetime.date.fromisoformat(sys.argv[1])' "$DRAW_DATE"
          echo "draw=$DRAW" >> "$GITHUB_OUTPUT"
          echo "date=$DRAW_DATE" >> "$GITHUB_OUTPUT"
          echo "Selected draw date: $DRAW_DATE (IST)"

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$SAMBAD_API_TOKEN" || { echo "Missing GitHub secret LOTTERY_SAMBAD_API_TOKEN"; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo "Missing GitHub secret SUPABASE_SECRET_KEY"; exit 1; }

      - name: Fetch published result with retries
        id: fetch
        shell: bash
        run: |
          mkdir -p api-results
          DRAW="${{ steps.draw.outputs.draw }}"
          if [ "$DRAW" = "8pm" ]; then
            MAX_ATTEMPTS=37
          else
            MAX_ATTEMPTS=12
          fi

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "API fetch attempt $attempt/$MAX_ATTEMPTS for $DRAW"
            if python monitor/import_sambad_api.py \
              --draw "$DRAW" \
              --date "${{ steps.draw.outputs.date }}" \
              --output-dir api-results; then
              echo "Result fetched and structurally validated."
              echo "available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              if [ "$DRAW" = "8pm" ] && [ "$attempt" -lt 16 ]; then
                echo "Result not published yet; fast polling: retrying in 1 minute (early window)."
                sleep 60
              else
                echo "Result not published yet; standard polling: retrying in 5 minutes."
                sleep 300
              fi
            fi
          done

          if [ "$DRAW" = "8pm" ]; then
            DRAW_DATE="${{ steps.draw.outputs.date }}"
            printf '{"date":"%s","draw":"8PM","status":"PENDING_NOT_PUBLISHED","attempts":%s}\n' \
              "$DRAW_DATE" "$MAX_ATTEMPTS" > "api-results/${DRAW_DATE}_8PM_PENDING.json"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "PENDING: 8PM result was not published after 37 attempts (about 3 hours). No incomplete data was uploaded."
            exit 0
          fi

          echo "ERROR: 1PM result was not fetched after $MAX_ATTEMPTS attempts."
          exit 1

      - name: Sync validated result to Supabase
        if: steps.fetch.outputs.available == 'true'
        run: |
          FILE="api-results/${{ steps.draw.outputs.date }}_${{ steps.draw.outputs.draw == '1pm' && '1PM' || '8PM' }}.json"
          python monitor/sync_result_to_supabase.py --file "$FILE"

      - name: Archive fetched result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nagaland-result-${{ steps.draw.outputs.draw }}-${{ github.run_id }}
          path: api-results/*.json
          if-no-files-found: ignore
          retention-days: 90
