name: R002.1 Position-Stratified Validation
on:
  workflow_dispatch:
    inputs:
      permutations:
        description: "Whole-draw permutation replicates"
        required: true
        default: "1000"
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --upgrade pip numpy
      - name: Verify full backup
        run: test -s analysis-input/dear_lottery_full_backup_2026-11-20.json
      - name: Run R002.1
        run: |
          python monitor/r0021_position_stratified.py \
            --input analysis-input/dear_lottery_full_backup_2026-11-20.json \
            --outdir r0021-output \
            --permutations "${{ inputs.permutations }}"
      - name: Upload R002.1 report
        uses: actions/upload-artifact@v4
        with:
          name: R0021-position-stratified-validation
          path: r0021-output/
          if-no-files-found: error
