
name: Validator Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight human-verified historical archive
        run: python monitor/validate_historical_csv.py data/human_verified_draws_2023-01.csv

      - name: Try downloading the two official January source PDFs
        continue-on-error: true
        run: python monitor/archive_official_sources.py --csv data/human_verified_draws_2023-01.csv --output-dir official-source-archive

      - name: Upload official source PDFs and acquisition manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nagaland-official-source-test
          path: official-source-archive/
          if-no-files-found: warn
          retention-days: 30

      - name: Discover sources for first 25 historical date/draw pairs
        continue-on-error: true
        run: python monitor/archive_official_sources.py --csv data/nagaland_master_prize_numbers.csv --output-dir historical-source-batch-000 --offset 0 --limit 25

      - name: Upload first historical source batch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nagaland-source-batch-000
          path: historical-source-batch-000/
          if-no-files-found: warn
          retention-days: 30

      - name: Run validator tests
        run: python -m unittest -v monitor.test_validate_result monitor.test_human_verified_archive monitor.test_historical_csv_preflight monitor.test_archive_official_sources monitor.test_import_sambad_api

  recover-2025-remaining-pdfs:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'recovery/2025-full-year'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - name: Checkout recovery branch only
        uses: actions/checkout@v4
        with:
          ref: recovery/2025-full-year
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF text extraction
        run: python -m pip install --upgrade pip pdfplumber

      - name: Download, hash, cross-check and extract remaining 2025 sheets
        run: python monitor/recover_2025_lotterysambad_icu.py

      - name: Preserve PDFs and recovery manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nagaland-2025-remaining-pdf-recovery
          path: |
            sources/2025/lotterysambad_icu_recovery/
            data/recovery_2025_icu_pdf_source_manifest_2026-11-21.json
            data/recovered_draws_2025_full_tier_icu_aug_sep_oct_2026-11-21.csv
            data/recovered_draws_2025_icu_partial_extractions_2026-11-21.csv
            data/recovered_draws_2025_icu_source_conflicts_2026-11-21.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Commit recovery outputs to recovery branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/2025/lotterysambad_icu_recovery/ \
            data/recovered_draws_2025_full_tier_icu_aug_sep_oct_2026-11-21.csv \
            data/recovered_draws_2025_icu_partial_extractions_2026-11-21.csv \
            data/recovered_draws_2025_icu_source_conflicts_2026-11-21.csv \
            data/recovery_2025_icu_pdf_source_manifest_2026-11-21.json \
            data/recovery_audit_2025_full_tier_group_map.json \
            data/recovery_manifest_2025_sources.json \
            data/recovery_exceptions_2025.json \
            data/recovery_source_crosschecks_2025.csv
          if git diff --cached --quiet; then
            echo "No recovery changes to commit."
          else
            git commit -m "Recover remaining 2025 Aug-Oct full sheets [skip ci]"
            git push origin HEAD:recovery/2025-full-year
          fi
