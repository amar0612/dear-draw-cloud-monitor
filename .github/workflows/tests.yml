
name: Validator Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight human-verified historical archive
        run: python monitor/validate_historical_csv.py data/human_verified_draws_2023-01.csv

      - name: Run validator tests
        run: python -m unittest monitor.test_validate_result monitor.test_human_verified_archive monitor.test_historical_csv_preflight monitor.test_archive_official_sources -v
