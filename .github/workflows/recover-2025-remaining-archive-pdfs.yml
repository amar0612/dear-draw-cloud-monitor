name: Recover Remaining 2025 Nagaland 1PM and 8PM Archive PDFs

on:
  push:
    branches:
      - recovery/2025-full-year
    paths:
      - ".github/workflows/recover-2025-remaining-archive-pdfs.yml"
      - "monitor/import_2025_icu_pdf_artifact.py"

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout recovery branch only
        uses: actions/checkout@v4
        with:
          ref: recovery/2025-full-year
          fetch-depth: 0

      - name: Download preserved PDF acquisition artifact
        uses: actions/download-artifact@v4
        with:
          name: nagaland-2025-remaining-pdf-recovery
          run-id: 44874988467
          github-token: ${{ github.token }}
          path: recovery-input

      - name: Install PDF text extraction
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Validate dates, extract all tiers and reconcile sources
        run: python monitor/import_2025_icu_pdf_artifact.py --artifact-dir recovery-input

      - name: Preserve corrected source and extraction manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nagaland-2025-corrected-full-tier-import
          path: |
            sources/2025/lotterysambad_icu_recovery/
            data/recovery_2025_icu_pdf_source_manifest_2026-11-21.json
            data/recovery_2025_icu_pdf_source_manifest_2026-11-21_attempt1.json
            data/recovered_draws_2025_full_tier_icu_aug_sep_oct_2026-11-21.csv
            data/recovered_draws_2025_icu_partial_extractions_2026-11-21.csv
            data/recovered_draws_2025_icu_source_conflicts_2026-11-21.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Commit recovery outputs to recovery branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sources/2025/lotterysambad_icu_recovery/ \
            data/recovered_draws_2025_full_tier_icu_aug_sep_oct_2026-11-21.csv \
            data/recovered_draws_2025_icu_partial_extractions_2026-11-21.csv \
            data/recovered_draws_2025_icu_source_conflicts_2026-11-21.csv \
            data/recovery_2025_icu_pdf_source_manifest_2026-11-21.json \
            data/recovery_2025_icu_pdf_source_manifest_2026-11-21_attempt1.json \
            data/recovery_audit_2025_full_tier_group_map.json \
            data/recovery_manifest_2025_sources.json \
            data/recovery_exceptions_2025.json \
            data/recovery_source_crosschecks_2025.csv
          if git diff --cached --quiet; then
            echo "No recovery changes to commit."
          else
            git commit -m "Import remaining 2025 full-tier sheets and source PDFs [skip ci]"
            git push origin HEAD:recovery/2025-full-year
          fi
