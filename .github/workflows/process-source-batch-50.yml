name: Parse and merge recovered Nagaland source batch 50

on:
  workflow_run:
    workflows:
      - ICU-first archive with fallback (batch offset 50)
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: parse-nagaland-source-batch-50
  cancel-in-progress: false

jobs:
  parse:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF text extraction utility
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Download source PDFs from completed archive run
        uses: actions/download-artifact@v4
        with:
          name: nagaland-source-batch-50
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source-batch
      - name: Extract full-tier 1PM and 8PM results
        run: |
          python monitor/parse_lottery_sambad_pdfs.py \
            --input-dir source-batch \
            --output data/recovered_2025_full_tier_batch_12.csv
      - name: Commit extracted batch for automatic master merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recovered_2025_full_tier_batch_12.csv
          if git diff --cached --quiet; then
            echo "No new extracted batch changes."
          else
            git commit -m "Add extracted Nagaland 2025 full-tier batch 12"
            git push origin HEAD:main
          fi
