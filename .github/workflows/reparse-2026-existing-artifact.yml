name: Re-parse existing 2026 Nagaland PDFs

on:
  push:
    paths:
      - .github/workflows/reparse-2026-existing-artifact.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reparse-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the already recovered PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: nagaland-2026-retry-csv-and-source-pdfs
          path: incoming
          repository: amar0612/dear-draw-cloud-monitor
          run-id: 44669176839
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF extraction and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Parse existing 2026 PDFs
        run: |
          MANIFEST=$(find incoming -path '*/yearly-archive/2026/manifest.json' -print -quit)
          test -n "$MANIFEST"
          INPUT_DIR="$(dirname "$MANIFEST")"
          python monitor/parse_lottery_sambad_pdfs.py \
            --input-dir "$INPUT_DIR" \
            --output yearly-csv/nagaland_2026_jan-nov20_full_tier.csv

      - name: Upload parsed CSV and extraction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nagaland-2026-reparsed-full-tier-csv
          path: |
            yearly-csv/
            incoming/yearly-archive/2026/manifest.json
          if-no-files-found: warn
          retention-days: 90
