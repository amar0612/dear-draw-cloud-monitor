name: Automated 2023 R2 Historical Recovery

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Date/draw pairs per batch
        required: true
        default: "25"
      max_batches:
        description: Batches to process in this run; scheduled runs process one batch and resume automatically
        required: true
        default: "1"

permissions:
  contents: read

concurrency:
  group: nagaland-2023-r2-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install R2 client
        run: python -m pip install --upgrade boto3

      - name: Run or resume complete 2023 campaign
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          cd monitor
          python run_r2_recovery_campaign.py \
            --csv ../data/recovery_candidates_2023.csv \
            --batch-size "${{ inputs.batch_size || '25' }}" \
            --max-batches "${{ inputs.max_batches || '1' }}" \
            ${{ github.event_name == 'schedule' && '--scheduled' || '' }}

      - name: Upload final ZIP as a convenient GitHub download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nagaland-2023-r2-recovery-final
          path: monitor/official-source-archive/final/nagaland_2023_recovery.zip
          if-no-files-found: warn
          retention-days: 30
