name = "dear-draw-historical-dispatcher"
main = "src/index.js"
compatibility_date = "2026-11-21"

[triggers]
# Offset from the existing GitHub Actions schedule to avoid simultaneous dispatch races.
crons = ["*/10 * * * *"]

[vars]
# Enabled after GitHub credential validation and removal of the legacy GitHub Actions cron.
HISTORICAL_CRON_ENABLED = "true"
