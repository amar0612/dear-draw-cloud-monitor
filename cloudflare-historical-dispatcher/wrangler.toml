name = "dear-draw-historical-dispatcher"
main = "src/index.js"
compatibility_date = "2026-11-21"

[triggers]
# Offset from the existing GitHub Actions schedule to avoid simultaneous dispatch races.
crons = ["12,27,42,57 * * * *"]

[vars]
# Keep paused until the dispatcher is tested and the legacy GitHub schedule is disabled.
HISTORICAL_CRON_ENABLED = "false"
